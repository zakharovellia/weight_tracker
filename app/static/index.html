<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер веса</title>
<script src="/static/vendor/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>🏋️ Трекер веса</h1>
  <div id="stats-strip"></div>
</header>

<main>
  <!-- ===== Формы ввода ===== -->
  <section class="forms">
    <div class="card">
      <h2>⚖️ Вес</h2>
      <form id="form-weight">
        <label>Дата <input type="date" name="weight_date" required></label>
        <label>Вес, кг <input type="number" step="0.1" min="40" max="250" name="weight_kg" required placeholder="99.5"></label>
        <button type="submit">Сохранить</button>
      </form>
    </div>

    <div class="card">
      <h2>🍽 Питание</h2>
      <form id="form-nutrition">
        <label>Дата <input type="date" name="nutrition_date" required></label>
        <label>Калории <input type="number" min="0" max="10000" name="calories" placeholder="2200"></label>
        <label>Белок, г <input type="number" min="0" max="500" name="protein_g" placeholder="150"></label>
        <button type="submit">Сохранить</button>
      </form>
    </div>

    <div class="card">
      <h2>🥊 Тренировка</h2>
      <form id="form-workout">
        <label>Дата <input type="date" name="workout_date" required></label>
        <label>Тип
          <select name="workout_type">
            <option value="gym">Зал</option>
            <option value="boxing">Бокс</option>
            <option value="cardio">Кардио</option>
            <option value="other">Другое</option>
          </select>
        </label>
        <label>Длит., мин <input type="number" min="1" max="600" name="duration_min" required placeholder="90"></label>
        <label>Интенсивность
          <select name="intensity">
            <option value="">—</option>
            <option value="low">Низкая</option>
            <option value="medium" selected>Средняя</option>
            <option value="high">Высокая</option>
          </select>
        </label>
        <button type="submit">Добавить</button>
      </form>
    </div>
  </section>

  <!-- ===== Графики ===== -->
  <section class="charts">
    <div class="card wide">
      <h2>Вес (дневной + среднее за 7 дней)</h2>
      <div class="chart-wrap"><canvas id="chart-weight"></canvas></div>
    </div>
    <div class="card wide">
      <h2>Калории и белок vs цель</h2>
      <div class="chart-wrap"><canvas id="chart-nutrition"></canvas></div>
    </div>
  </section>

  <!-- ===== Журнал ===== -->
  <section class="card">
    <h2>Последние записи</h2>
    <div class="log-controls">
      <button class="tab active" data-tab="weight">Вес</button>
      <button class="tab" data-tab="nutrition">Питание</button>
      <button class="tab" data-tab="workouts">Тренировки</button>
    </div>
    <table id="log-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
