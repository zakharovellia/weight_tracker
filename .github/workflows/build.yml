name: Build, Push & Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          TS=$(date -u +%Y%m%d)
          echo "tag=${TS}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/weight_tracker:${{ steps.tag.outputs.tag }}
            ${{ secrets.NEXUS_REGISTRY }}/weight_tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: zakharovellia/devops
          token: ${{ secrets.DEVOPS_PAT }}
          path: devops
          fetch-depth: 0

      - name: Bump image tag in k3s/weight-tracker.yml
        working-directory: devops
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          set -euo pipefail
          FILE="k3s/weight-tracker.yml"
          yq -i \
            "(select(.kind == \"Deployment\") | .spec.template.spec.containers[] | select(.image | test(\"${REGISTRY}/weight_tracker(:|\\$)\")) | .image) = \"${REGISTRY}/weight_tracker:${TAG}\"" \
            "$FILE"
          echo "Bumped weight_tracker -> ${REGISTRY}/weight_tracker:${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "bump(weight-tracker): -> ${TAG}"
          git pull --rebase origin main
          git push origin main
